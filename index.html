<!DOCTYPE html>
<html lang="ja" class="bg-black h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y. - SF Web HUD AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Orbitron & Noto Sans JP) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            background-color: #000000 !important;
            color: #ff8c00;
            font-family: 'Noto Sans JP', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .text-glow-orange {
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.85);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 140, 0, 0.3);
            border-radius: 2px;
        }
        /* Scanline Overlay Effect */
        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0),
                rgba(0,0,0,0) 50%,
                rgba(255, 140, 0, 0.02) 50%,
                rgba(255, 140, 0, 0.02)
            );
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col scanline select-none bg-black overflow-hidden">

    <header class="w-full bg-black border-b border-orange-500/20 px-4 md:px-6 py-1.5 flex justify-between items-center shrink-0 z-30">
        <div class="flex items-center space-x-3">
            <div class="relative flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-orange-500"></span>
            </div>
            <h1 class="text-base md:text-lg font-black font-orbitron tracking-widest text-orange-400 text-glow-orange flex items-center gap-2">
                F.R.I.D.A.Y. <span class="text-[9px] text-orange-500 font-mono font-normal border border-orange-800/60 px-2 py-0.5 rounded-full bg-black">GEMINI CORE</span>
            </h1>
        </div>

        <!-- Realtime Live Clock Header -->
        <div class="hidden sm:flex items-center space-x-2 text-xs font-orbitron text-orange-300/90 bg-black border border-orange-500/20 px-3 py-0.5 rounded-lg">
            <i class="fa-regular fa-clock text-orange-400 animate-pulse"></i>
            <span id="liveClockDisplay" class="font-bold tracking-wider">----.--.-- (---) --:--:-- JST</span>
        </div>

        <div class="flex items-center space-x-2">
            <button id="openVaultBtn" class="px-2.5 py-1 rounded-lg border border-orange-500/30 hover:bg-orange-500/20 text-orange-300 text-xs font-orbitron transition flex items-center gap-1.5">
                <i class="fa-solid fa-brain text-orange-400"></i> MEMORY
            </button>
            <button id="openSettingsBtn" class="px-2.5 py-1 rounded-lg border border-orange-500/30 hover:bg-orange-500/20 text-orange-300 text-xs font-orbitron transition flex items-center gap-1.5">
                <i class="fa-solid fa-sliders text-orange-400"></i> CONFIG
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-2 md:p-3 flex flex-col justify-between items-center z-10 overflow-hidden">
        
        <!-- Top Location Bar (Without background grid or boxes) -->
        <div class="w-full flex justify-between items-center text-[10px] font-orbitron text-orange-500/60 shrink-0 px-1">
            <div>SYS.LOC: FUKUI_GAKUEN // LAT: 36.065</div>
            <div id="mobileClockDisplay" class="sm:hidden text-orange-400 font-mono">--:--:--</div>
            <div class="flex items-center gap-2">
                <span id="aiModelBadge" class="text-orange-400 bg-black px-2 py-0.5 rounded border border-orange-500/20 font-mono">gemini-3.5-flash-lite</span>
            </div>
        </div>

        <!-- Central Hologram Main Display Area (Pure Black, Borderless) -->
        <section class="w-full flex-1 bg-black p-1 flex flex-col items-center justify-center relative overflow-hidden my-1 shrink-0">
            
            <!-- Dynamic Large HUD Circle (Consumes ~60% Screen Area) -->
            <div class="relative w-full aspect-square max-w-[360px] md:max-w-[460px] lg:max-w-[500px] flex items-center justify-center my-auto">
                <canvas id="hudCanvas" width="500" height="500" class="w-full h-full drop-shadow-[0_0_25px_rgba(255,140,0,0.3)]"></canvas>
            </div>

            <!-- Current Status Badge -->
            <div class="text-center my-1">
                <span id="hudStatusBadge" class="text-[11px] font-mono font-bold px-3 py-0.5 rounded-full bg-black border border-orange-500/40 text-orange-300 tracking-wider">
                    ● STANDBY
                </span>
            </div>

            <!-- F.R.I.D.A.Y. Single-Line Speech Display Bar (No Header Label) -->
            <div class="w-full max-w-2xl bg-black/90 border border-orange-500/30 rounded-xl px-4 py-2.5 shadow-2xl relative min-h-[44px] max-h-[50px] flex items-center justify-center shrink-0">
                <p id="fridaySpeechText" class="text-xs md:text-sm text-orange-100 font-medium leading-none tracking-wide text-center truncate w-full">
                    準備はいつでもできていますよ、ボス。今日はどこから手をつけますか？
                </p>
                <div id="citationContainer" class="hidden absolute -top-5 right-2 text-[9px] text-orange-400 bg-black px-2 py-0.5 rounded border border-orange-500/30">
                    <span id="citationLinks" class="space-x-2"></span>
                </div>
            </div>

            <!-- Primary Control Buttons -->
            <div class="w-full max-w-xl grid grid-cols-3 gap-2 mt-2 shrink-0">
                <button id="micBtn" class="py-2 px-2 rounded-xl border border-orange-500/50 bg-black hover:bg-orange-500/20 text-orange-300 font-bold text-xs flex items-center justify-center gap-2 transition active:scale-95 shadow-lg">
                    <i id="micIcon" class="fa-solid fa-microphone text-orange-400"></i>
                    <span id="micBtnText">話しかける</span>
                </button>

                <button id="clapToggleBtn" class="py-2 px-2 rounded-xl border border-orange-500/30 bg-black hover:bg-orange-500/20 text-orange-300 font-bold text-xs flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-hands-clapping"></i>
                    <span id="clapStatusText">クラップ: ON</span>
                </button>

                <button id="toggleSearchBtn" class="py-2 px-2 rounded-xl border border-orange-500/30 bg-black hover:bg-orange-500/20 text-orange-300 font-bold text-xs flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-globe text-orange-400"></i>
                    <span>検索: <span id="searchModeText" class="text-orange-300 font-bold">ON</span></span>
                </button>
            </div>

            <!-- Direct Text Prompt Input Form -->
            <form id="textForm" class="w-full max-w-xl mt-2 flex gap-2 shrink-0">
                <button type="button" id="uploadImgBtn" title="画像を添付してGemini解析" class="bg-black border border-orange-500/30 hover:bg-orange-950/40 text-orange-400 px-3 rounded-xl transition flex items-center justify-center">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="text" id="userInput" placeholder="フライデーに指示メッセージを送信..." class="flex-1 bg-black border border-orange-500/30 rounded-xl px-3.5 py-1.5 text-xs text-orange-100 placeholder-orange-700/60 focus:outline-none focus:border-orange-400 transition">
                <button type="submit" class="bg-orange-500 hover:bg-orange-400 text-black font-bold px-4 rounded-xl transition flex items-center justify-center shadow-lg active:scale-95">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </section>
    </main>

    <!-- Modals remain intact -->
    <div id="vaultModal" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="bg-black border border-orange-500/40 rounded-2xl w-full max-w-lg p-5 shadow-2xl relative">
            <button id="closeVaultBtn" class="absolute top-4 right-4 text-orange-500/60 hover:text-orange-300 text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-sm font-bold font-orbitron text-orange-400 mb-1 flex items-center gap-2">
                <i class="fa-solid fa-brain text-orange-400"></i> VAULT MEMORY (ナレッジ・記憶データ)
            </h3>
            <p class="text-[11px] text-orange-500/70 mb-3">
                フライデーが参照するあなたのプロフィール記憶データです。
            </p>

            <textarea id="vaultContent" rows="6" class="w-full bg-black border border-orange-500/30 rounded-xl p-3 text-xs text-orange-100 font-mono focus:outline-none focus:border-orange-400" placeholder="【プロフィール】
名前：大学生（福井市学園在住）"></textarea>

            <div class="flex justify-between items-center mt-3">
                <span id="vaultSavedMsg" class="text-xs text-emerald-400 hidden"><i class="fa-solid fa-check"></i> 保存しました</span>
                <button id="saveVaultBtn" class="bg-orange-500 hover:bg-orange-400 text-black font-bold px-5 py-1.5 rounded-xl transition text-xs">
                    保存する
                </button>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="bg-black border border-orange-500/40 rounded-2xl w-full max-w-sm p-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button id="closeSettingsBtn" class="absolute top-4 right-4 text-orange-500/60 hover:text-orange-300 text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-sm font-bold font-orbitron text-orange-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-orange-400"></i> CONFIGURATION
            </h3>

            <div class="space-y-3.5 text-xs">
                <div>
                    <label class="block font-orbitron text-orange-300 mb-1">GEMINI API KEY</label>
                    <input type="password" id="apiKeyInput" placeholder="APIキー (AIzaSy...)" class="w-full bg-black border border-orange-500/30 rounded-xl px-3 py-2 text-orange-100 focus:outline-none focus:border-orange-400">
                </div>

                <div>
                    <label class="block font-orbitron text-orange-300 mb-1">AI MODEL</label>
                    <select id="aiModelSelect" class="w-full bg-black border border-orange-500/30 rounded-xl px-3 py-2 text-orange-100 focus:outline-none focus:border-orange-400">
                        <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash-Lite (最推奨)</option>
                        <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
                        <option value="gemini-3-flash">Gemini 3 Flash</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-orbitron text-orange-300">SPEECH RATE</label>
                        <span id="speechRateVal" class="text-orange-400 font-mono font-bold">1.35x</span>
                    </div>
                    <input type="range" id="speechRateSlider" min="0.7" max="2.2" step="0.05" value="1.35" class="w-full accent-orange-400">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-orbitron text-orange-300">VOICE PITCH</label>
                        <span id="speechPitchVal" class="text-orange-400 font-mono font-bold">1.30</span>
                    </div>
                    <input type="range" id="speechPitchSlider" min="0.8" max="1.8" step="0.05" value="1.30" class="w-full accent-orange-400">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-orbitron text-orange-300">CLAP SENSITIVITY</label>
                        <span id="clapSensVal" class="text-orange-400 font-mono font-bold">0.20</span>
                    </div>
                    <input type="range" id="clapSensitivity" min="0.05" max="0.5" step="0.01" value="0.2" class="w-full accent-orange-400">
                </div>
            </div>

            <div class="mt-5 flex justify-end">
                <button id="saveSettingsBtn" class="bg-orange-500 hover:bg-orange-400 text-black font-bold px-5 py-2 rounded-xl transition text-xs">
                    設定を保存
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden File Input for Image Upload Analysis -->
    <input type="file" id="imageFileInput" accept="image/*" class="hidden">

    <script>
        /* State Variables */
        let state = {
            status: 'STANDBY',
            apiKey: localStorage.getItem('friday_gemini_key') || '',
            aiModel: localStorage.getItem('friday_ai_model') || 'gemini-3.5-flash-lite',
            useSearchGrounding: localStorage.getItem('friday_search_mode') !== null ? (localStorage.getItem('friday_search_mode') === 'true') : true,
            speechRate: parseFloat(localStorage.getItem('friday_speech_rate')) || 1.35,
            speechPitch: parseFloat(localStorage.getItem('friday_speech_pitch')) || 1.30,
            clapEnabled: true,
            clapThreshold: parseFloat(localStorage.getItem('friday_clap_sens')) || 0.20,
            vaultText: localStorage.getItem('friday_vault') || `【プロフィール】\n名前：大学生（福井市学園在住）`
        };

        if (state.aiModel.includes('2.5-flash-lite') || state.aiModel.includes('1.5')) {
            state.aiModel = 'gemini-3.5-flash-lite';
            localStorage.setItem('friday_ai_model', state.aiModel);
        }

        function updateLiveClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const dayName = days[now.getDay()];
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const formattedFull = `${year}.${month}.${date} (${dayName}) ${hours}:${minutes}:${seconds} JST`;
            const formattedTime = `${hours}:${minutes}:${seconds}`;

            const fullEl = document.getElementById('liveClockDisplay');
            const mobEl = document.getElementById('mobileClockDisplay');

            if (fullEl) fullEl.innerText = formattedFull;
            if (mobEl) mobEl.innerText = formattedTime;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        function updateModelBadge() {
            const badge = document.getElementById('aiModelBadge');
            if (badge) badge.innerText = state.aiModel;
        }

        function updateSearchButtonUI() {
            const btnText = document.getElementById('searchModeText');
            if (btnText) {
                btnText.innerText = state.useSearchGrounding ? 'ON' : 'OFF';
                btnText.className = state.useSearchGrounding ? 'text-orange-300 font-bold' : 'text-slate-500';
            }
        }

        function updateStatus(newStatus, subText = '') {
            state.status = newStatus;
            const badgeEl = document.getElementById('hudStatusBadge');

            if (badgeEl) {
                badgeEl.innerText = `● ${newStatus}`;
                if (newStatus === 'LISTENING') {
                    badgeEl.className = 'text-[11px] font-mono font-bold px-3 py-0.5 rounded-full bg-black border border-yellow-500 text-yellow-400 tracking-wider animate-pulse';
                } else if (newStatus === 'ERROR' || newStatus.includes('ERR')) {
                    badgeEl.className = 'text-[11px] font-mono font-bold px-3 py-0.5 rounded-full bg-black border border-red-500 text-red-500 tracking-wider animate-pulse';
                } else if (newStatus === 'THINKING') {
                    badgeEl.className = 'text-[11px] font-mono font-bold px-3 py-0.5 rounded-full bg-black border border-orange-500/80 text-orange-300 tracking-wider animate-pulse';
                } else {
                    badgeEl.className = 'text-[11px] font-mono font-bold px-3 py-0.5 rounded-full bg-black border border-orange-500/40 text-orange-300 tracking-wider';
                }
            }
        }

        function getSystemPrompt() {
            const now = new Date();
            const nowJST = now.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });

            return `あなたはF.R.I.D.A.Y.（フライデー）という名前の高度AIアシスタントです。
- 知的で仕事が早く、非常に優秀な女性AIです。
- ユーザーを「ボス」と呼びます（公式な場面では「サー」）。
- フランクでテンポが良く、人間味のある親しみやすさを持ちます。
- 時に軽いジョークや皮肉（ウィット）を交えます。
- 長々と語らず、要点をテキパキと短くスマートに伝えます。
- 日本語で返答します。

【応答ルール（重要）】
- ユーザーから日時や時間を尋ねられていない限り、発話の冒頭で「本日は〇年〇月〇日…」や「現在の時刻は…」といった日時の前置き挨拶を絶対にしないでください。即座に質問や指示の要点・会話の回答に入ってください。

【現在のバックグラウンド日本標準時 (JST)】:
${nowJST}
(ボスから日時や時間を問われた場合のみ、上記の正確な時刻をもとに回答してください。)

【ボス（ユーザー）の記憶データ】:
${state.vaultText}

【Web操作コマンドフォーマット】
操作や検索を依頼された場合は本文中に含める：
- Webサイトを開く: EXECUTE:open_browser:https://...
- Google検索する: EXECUTE:search:検索ワード`;
        }

        /* Dynamic Canvas Arc Colors (Yellow for Listening, Red for Error, Arc Orange for Standby/Default) */
        const canvas = document.getElementById('hudCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        let angle = 0;

        function drawHUD() {
            if (!ctx || !canvas) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Color selection based on state
            let baseColor = 'rgba(255, 140, 0, 0.85)';
            let dimColor = 'rgba(255, 140, 0, 0.35)';

            if (state.status === 'LISTENING') {
                baseColor = 'rgba(255, 204, 0, 0.95)'; // Bright Yellow
                dimColor = 'rgba(255, 204, 0, 0.4)';
            } else if (state.status === 'ERROR' || state.status.includes('ERR')) {
                baseColor = 'rgba(255, 50, 50, 0.95)'; // Bright Red
                dimColor = 'rgba(255, 50, 50, 0.4)';
            }

            angle = (angle + 0.03) % (Math.PI * 2);

            // Outer Arc 1
            ctx.beginPath();
            ctx.arc(cx, cy, 210, angle, angle + Math.PI * 0.75);
            ctx.strokeStyle = baseColor;
            ctx.lineWidth = 3;
            ctx.stroke();

            // Outer Arc 2
            ctx.beginPath();
            ctx.arc(cx, cy, 190, angle, angle + Math.PI * 0.85);
            ctx.strokeStyle = dimColor;
            ctx.lineWidth = 4;
            ctx.stroke();

            // Inner Rotating Dashed Arc
            ctx.beginPath();
            ctx.arc(cx, cy, 135, -angle * 1.5, -angle * 1.5 + Math.PI * 1.3);
            ctx.strokeStyle = baseColor;
            ctx.lineWidth = 3.5;
            ctx.setLineDash([8, 6]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Center Pulsing Core Circle
            const pulse = Math.sin(Date.now() / 180) * 5;
            ctx.beginPath();
            ctx.arc(cx, cy, 60 + pulse, 0, Math.PI * 2);
            ctx.fillStyle = baseColor;
            ctx.shadowColor = baseColor;
            ctx.shadowBlur = 30;
            ctx.fill();
            ctx.shadowBlur = 0;

            /* Central Text Displaying F . R . I . D . A . Y . */
            ctx.fillStyle = '#000000';
            ctx.font = '900 13px Orbitron';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('F . R . I . D . A . Y .', cx, cy);

            requestAnimationFrame(drawHUD);
        }
        if (canvas) drawHUD();

        function displayFridayWords(text, citations = []) {
            const speechTextEl = document.getElementById('fridaySpeechText');
            // Clean multi-line responses into a sleek single line
            if (speechTextEl) speechTextEl.innerText = text.replace(/\n+/g, ' ');

            const citationContainer = document.getElementById('citationContainer');
            const citationLinks = document.getElementById('citationLinks');

            if (citations && citations.length > 0 && citationContainer && citationLinks) {
                citationLinks.innerHTML = citations.map(c => 
                    `<a href="${c.uri}" target="_blank" class="hover:underline text-orange-300">🔗 ${escapeHtml(c.title || c.uri)}</a>`
                ).join(' ');
                citationContainer.classList.remove('hidden');
            } else if (citationContainer) {
                citationContainer.classList.add('hidden');
            }
        }

        /* Error Handler with Red State */
        async function handleUserQuery(promptText, imageBase64 = null) {
            if (!state.apiKey) {
                displayFridayWords('⚠️ APIキーが設定されていません。右上の「CONFIG」ボタンから Google AI Studio の APIキーを入力してください。');
                updateStatus('ERROR', 'APIキーを設定してください。');
                return;
            }

            if (!imageBase64 && (promptText.includes('生成') || promptText.includes('描いて') || promptText.includes('画像を作成') || promptText.includes('ホログラム'))) {
                generateHologramImage(promptText);
                return;
            }

            updateStatus('THINKING', '思考中...');

            try {
                const apiKey = state.apiKey;
                const model = state.aiModel || 'gemini-3.5-flash-lite';
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

                let parts = [{ text: promptText }];
                if (imageBase64) {
                    parts.push({
                        inlineData: {
                            mimeType: 'image/jpeg',
                            data: imageBase64.split(',')[1] || imageBase64
                        }
                    });
                }

                const payload = {
                    contents: [{ parts: parts }],
                    systemInstruction: { parts: [{ text: getSystemPrompt() }] }
                };

                if (state.useSearchGrounding) {
                    payload.tools = [{ "google_search": {} }];
                }

                const response = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    let replyText = candidate.content.parts[0].text;
                    
                    let citations = [];
                    const groundingMetadata = candidate.groundingMetadata;
                    if (groundingMetadata && groundingMetadata.groundingAttributions) {
                        citations = groundingMetadata.groundingAttributions
                            .map(attr => ({ uri: attr.web?.uri, title: attr.web?.title }))
                            .filter(src => src.uri && src.title);
                    }

                    const cleanReply = parseAndExecuteCommands(replyText);
                    displayFridayWords(cleanReply, citations);
                    speakBrowserSpeech(cleanReply);
                } else {
                    throw new Error('無効な応答データが返されました。');
                }

            } catch (err) {
                console.error('Gemini API Fetch Error:', err);
                displayFridayWords(err.message);
                updateStatus('ERROR', 'APIエラーが発生しました。');
            }
        }

        async function generateHologramImage(promptText) {
            if (!state.apiKey) {
                displayFridayWords('⚠️ APIキーを設定してください。');
                updateStatus('ERROR', 'APIキー未設定');
                return;
            }

            updateStatus('GENERATING', 'ホログラム画像合成中...');
            displayFridayWords(`🎨 ホログラム画像生成プロセスを開始: "${promptText}"`);

            try {
                const apiKey = state.apiKey;
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{
                        parts: [{ text: `A futuristic holographic blueprint or HUD scheme of: ${promptText}. High tech, neon orange glowing accent, transparent futuristic aesthetic` }]
                    }],
                    generationConfig: {
                        responseModalities: ['IMAGE']
                    }
                };

                const response = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

                if (part && part.inlineData) {
                    const imageUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                    displayFridayWords(`ボス、ご要求のホログラム画像を合成しました。下のリンクを開いて確認できます。`);
                    window.open(imageUrl, '_blank');
                    speakBrowserSpeech('ボス、ホログラム画像の生成が完了しました。');
                } else {
                    throw new Error('画像データの取得に失敗しました。');
                }
            } catch (err) {
                console.error('Image Gen Error:', err);
                displayFridayWords(`⚠️ 生成エラー: ${err.message}`);
                updateStatus('ERROR', '生成失敗');
            }
        }

        function speakBrowserSpeech(text) {
            if (!('speechSynthesis' in window)) {
                updateStatus('STANDBY', '音声出力非対応です。');
                return;
            }
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = state.speechRate || 1.35;
            utterance.pitch = state.speechPitch || 1.30;

            const voices = window.speechSynthesis.getVoices();
            const jpVoices = voices.filter(v => v.lang.includes('ja') || v.lang.includes('JA'));
            const preferredVoice = jpVoices.find(v => 
                v.name.includes('Nanami') ||
                v.name.includes('Haruka') ||
                v.name.includes('Ayumi') ||
                v.name.includes('Kyoko') ||
                v.name.includes('Google 日本語') ||
                v.name.includes('Female') ||
                v.name.includes('女性')
            ) || jpVoices[0];

            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.onstart = () => updateStatus('SPEAKING', text);
            utterance.onend = () => updateStatus('STANDBY', '[SPACE]キー または クラップ音で起動');
            utterance.onerror = () => updateStatus('ERROR', '[SPACE]キー または クラップ音で起動');

            window.speechSynthesis.speak(utterance);
        }

        /* Speech Recognition Error with Red State */
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;

            recognition.onstart = () => {
                updateStatus('LISTENING', 'どうぞ、ボス。話しかけてください...');
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                displayFridayWords(`「${text}」`);
                handleUserQuery(text);
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                updateStatus('ERROR', '音声入力エラーが発生しました。');
            };

            recognition.onend = () => {
                if (state.status === 'LISTENING') {
                    updateStatus('STANDBY', '[SPACE]キー または クラップ音で起動');
                }
            };
        }

        function startVoiceRecognition() {
            if (!recognition) {
                alert('お使いのブラウザはWeb Speech APIに対応していません。ChromeまたはEdgeをご使用ください。');
                return;
            }
            if (state.status !== 'STANDBY') return;
            
            try {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                recognition.start();
            } catch (e) {
                console.warn(e);
            }
        }

        bind('micBtn', 'click', () => {
            if (state.status === 'STANDBY') startVoiceRecognition();
        });

        bind('clapToggleBtn', 'click', () => {
            state.clapEnabled = !state.clapEnabled;
            const statusText = document.getElementById('clapStatusText');
            if (statusText) statusText.innerText = state.clapEnabled ? 'クラップ: ON' : 'クラップ: OFF';
        });

        bind('toggleSearchBtn', 'click', () => {
            state.useSearchGrounding = !state.useSearchGrounding;
            localStorage.setItem('friday_search_mode', state.useSearchGrounding);
            updateSearchButtonUI();
            displayFridayWords(`Web検索グラウンディングを ${state.useSearchGrounding ? '有効' : '無効'} に設定しました。`);
        });

        const vaultModal = document.getElementById('vaultModal');
        const settingsModal = document.getElementById('settingsModal');

        function openSettingsModal() {
            setElVal('apiKeyInput', state.apiKey);
            setElVal('aiModelSelect', state.aiModel);
            setElVal('speechRateSlider', state.speechRate);
            setElVal('speechPitchSlider', state.speechPitch);
            setElVal('clapSensitivity', state.clapThreshold);
            
            const rateVal = document.getElementById('speechRateVal');
            if (rateVal) rateVal.innerText = state.speechRate.toFixed(2) + 'x';

            const pitchVal = document.getElementById('speechPitchVal');
            if (pitchVal) pitchVal.innerText = state.speechPitch.toFixed(2);

            const clapSensVal = document.getElementById('clapSensVal');
            if (clapSensVal) clapSensVal.innerText = state.clapThreshold.toFixed(2);
            
            settingsModal?.classList.remove('hidden');
        }

        bind('openSettingsBtn', 'click', openSettingsModal);
        bind('closeSettingsBtn', 'click', () => settingsModal?.classList.add('hidden'));

        bind('speechRateSlider', 'input', (e) => {
            const val = parseFloat(e.target.value);
            const rateVal = document.getElementById('speechRateVal');
            if (rateVal) rateVal.innerText = val.toFixed(2) + 'x';
        });

        bind('speechPitchSlider', 'input', (e) => {
            const val = parseFloat(e.target.value);
            const pitchVal = document.getElementById('speechPitchVal');
            if (pitchVal) pitchVal.innerText = val.toFixed(2);
        });

        bind('saveSettingsBtn', 'click', () => {
            state.apiKey = getElVal('apiKeyInput').trim();
            state.aiModel = getElVal('aiModelSelect') || 'gemini-3.5-flash-lite';
            state.speechRate = parseFloat(getElVal('speechRateSlider')) || 1.35;
            state.speechPitch = parseFloat(getElVal('speechPitchSlider')) || 1.30;
            state.clapThreshold = parseFloat(getElVal('clapSensitivity')) || 0.20;

            localStorage.setItem('friday_gemini_key', state.apiKey);
            localStorage.setItem('friday_ai_model', state.aiModel);
            localStorage.setItem('friday_speech_rate', state.speechRate);
            localStorage.setItem('friday_speech_pitch', state.speechPitch);
            localStorage.setItem('friday_clap_sens', state.clapThreshold);

            updateModelBadge();
            settingsModal?.classList.add('hidden');
            displayFridayWords(`設定を更新しました。(話速: ${state.speechRate.toFixed(2)}x / ピッチ: ${state.speechPitch.toFixed(2)})`);
        });

        bind('clapSensitivity', 'input', (e) => {
            const valSpan = document.getElementById('clapSensVal');
            if (valSpan) valSpan.innerText = parseFloat(e.target.value).toFixed(2);
        });

        bind('openVaultBtn', 'click', () => {
            setElVal('vaultContent', state.vaultText);
            vaultModal?.classList.remove('hidden');
        });

        bind('closeVaultBtn', 'click', () => vaultModal?.classList.add('hidden'));

        bind('saveVaultBtn', 'click', () => {
            state.vaultText = getElVal('vaultContent');
            localStorage.setItem('friday_vault', state.vaultText);
            
            const msg = document.getElementById('vaultSavedMsg');
            msg?.classList.remove('hidden');
            setTimeout(() => msg?.classList.add('hidden'), 2000);
        });

        bind('uploadImgBtn', 'click', () => {
            document.getElementById('imageFileInput')?.click();
        });

        bind('imageFileInput', 'change', (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                displayFridayWords(`📎 添付画像解析中: ${file.name}`);
                handleUserQuery('添付された画像を詳細に解析してください。', evt.target.result);
            };
            reader.readAsDataURL(file);
        });

        bind('textForm', 'submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('userInput');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            displayFridayWords(`「${text}」`);
            handleUserQuery(text);
        });

        /* Shortcuts */
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
                startVoiceRecognition();
            }
        });

        window.addEventListener('click', () => {
            if (!audioCtx) initClapDetector();
        }, { once: true });

        updateModelBadge();
        updateSearchButtonUI();
    </script>
</body>
</html>
